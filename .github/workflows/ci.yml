name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Migration release consistency and read-only rehearsal
        run: |
          mkdir -p test-results/migration-release
          node scripts/migration/release-gates.cjs > test-results/migration-release/report.json
          node -e 'const r=require("child_process").spawnSync(process.execPath,["scripts/migration/release-gates.cjs","--require-cutover"],{encoding:"utf8"});if(r.status!==2||JSON.parse(r.stdout).cutoverDecision!=="NO-GO")process.exit(1)'
      - name: Install audit browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Browser smoke tests
        run: npm run e2e
      - name: WebKit audit (emulated iPhone)
        run: npx playwright test --config=playwright.audit-webkit.config.ts
      - name: Lighthouse audit lab
        run: node scripts/audit/lighthouse.mjs
      - name: Repeated cutover performance sample
        run: node scripts/migration/performance.mjs
      - name: Cutover comparison screenshots
        run: node scripts/migration/capture.mjs
      - name: Deferred feature SSR link evidence
        run: node scripts/deferred/crawl.mjs
      - name: Dependency advisory audit
        run: npm audit --json > test-results/dependency-audit.json
      - name: Bind evidence to commit
        if: always()
        run: |
          mkdir -p test-results
          node -e 'const head=require("child_process").execFileSync("git",["rev-parse","HEAD"]).toString().trim();require("fs").writeFileSync("test-results/commit.json",JSON.stringify({sha:head,head,eventSha:process.env.GITHUB_SHA,node:process.version},null,2))'
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            !test-results/audit-lab/**
            !test-results/cutover-lab/**
            !test-results/release-audit-*/**
      - name: Upload calculator desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-desktop-evidence
          path: |
            test-results/release-audit-*-desktop/
            test-results/commit.json
      - name: Upload calculator mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-mobile-evidence
          path: |
            test-results/release-audit-*-mobile/
            test-results/commit.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: |
            test-results/audit-lab/
            test-results/cutover-lab/
            test-results/commit.json
  project-metadata:
    name: Policy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify Codex instructions
        run: |
          test -s AGENTS.md
          test -s docs/PRODUCT_SPEC.md
